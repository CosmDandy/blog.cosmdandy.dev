# Сборка сайта и доставка в Cloudflare Workers.
#
# Тот же принцип, что в security.yml: actions запиннены по полному commit SHA,
# а не по тегу — тег владелец экшена может передвинуть на другой код. Версия в
# комментарии для читаемости, пины обновляет Dependabot.
#
# Сборка и деплой разнесены по job'ам намеренно. Сборка исполняет чужой код:
# полсотни npm-пакетов @quartz-community/* со своими postinstall-скриптами. Она
# не должна видеть токен Cloudflare — иначе один скомпрометированный плагин
# уносит доступ к воркерам. Токен живёт только в deploy, который ничего не
# собирает, а лишь заливает готовый артефакт.
name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Пусто на уровне workflow — каждая job запрашивает права явно и минимально.
permissions: {}

concurrency:
  # Не отменяем на лету: прерванный деплой оставит воркер в промежуточном
  # состоянии. Очередь подождёт, сборка блога занимает секунды.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: сборка
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история нужна плагину дат: он берёт время создания и правки
          # заметки из git-лога. При shallow-клоне все страницы получат дату
          # последнего коммита.
          fetch-depth: 0
          # По умолчанию checkout пишет токен в .git/config, откуда его прочтёт
          # любой следующий шаг — включая postinstall-скрипты зависимостей.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Сборка Quartz
        run: npx quartz build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: public/
          retention-days: 7

  deploy:
    name: деплой
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://blog.cosmdandy.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Нужен только wrangler.jsonc, история не требуется.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: public/

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  preview:
    name: превью
    needs: build
    # Только для PR из этого же репозитория: ветке из форка секреты не
    # достаются, и это правильно — иначе любой желающий получал бы токен,
    # открыв PR. Для форков job просто пропускается.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: public/

      # versions upload, а не deploy: заливается новая версия воркера со своим
      # preview-адресом, но прод продолжает отдавать текущую. Отдельный воркер
      # на каждый PR для этого заводить не нужно.
      - id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      # Ссылка кладётся в summary прогона, а не комментарием в PR: комментарий
      # требует pull-requests: write и ещё одного стороннего экшена, а читать
      # всё равно из вкладки Actions.
      - name: Ссылка на превью
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          {
            echo "### Превью этой версии"
            echo
            echo '```'
            printf '%s' "$OUTPUT" | grep -i "preview" \
              || echo "адрес не найден в выводе wrangler"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
