# Пины по SHA не обновляются сами — этим занимается Dependabot: он поднимает PR
# с новым SHA и правит комментарий-версию рядом.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Пауза перед обновлением: большинство supply-chain атак на пакеты и экшены
    # выявляют в первые дни, поэтому свежие релизы не тянем сразу.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Само ядро Quartz приходит merge'ом из upstream, но его зависимости и плагины
  # @quartz-community/* — обычные npm-пакеты, и обновляются отдельно от ядра.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Одной группой: плагинов больше сорока, поштучные PR дали бы десяток
      # обновлений в неделю, а проверяются они всё равно одной сборкой.
      npm:
        patterns: ["*"]
